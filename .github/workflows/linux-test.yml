name: Linux Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libepoxy-dev libx11-dev \
            libtirpc-dev libltdl-dev python3-venv \
            autoconf automake autoconf-archive \
            libkrb5-dev openssl gperf

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "db23990c5a6e2953bf1eb8c86e9a64c73d5b1fa7"

      # restore and save apart, so a failing test still keeps the built packages
      - name: Restore vcpkg installed packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-linux-test-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}
          restore-keys: |
            vcpkg-installed-linux-test-${{ runner.arch }}-

      - name: Inject secrets into APP_METADATA
        run: |
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> APP_METADATA
          echo "POLAR_ORGANIZATION_ID=${{ secrets.POLAR_ORGANIZATION_ID }}" >> APP_METADATA
          echo "CREDS_SECRET=${{ secrets.CREDS_SECRET }}" >> APP_METADATA

      - name: Run tests
        env:
          CMAKE_GENERATOR: Ninja
          # ensure each test prints [ RUN ] / [ OK ] lines unbuffered so a
          # hang shows the last-running test in the GitHub Actions log
          GTEST_COLOR: "no"
          GTEST_PRINT_TIME: "1"
        run: |
          # wall-clock cap (a cold vcpkg build alone takes ~30 min) so a hung test
          # cannot silently consume the whole job timeout
          stdbuf -oL -eL timeout --foreground 75m ./scripts/run-tests

      - name: Save vcpkg installed packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/vcpkg_installed
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Dump container logs on failure
        if: failure()
        run: |
          for c in dearsql-postgres-test dearsql-mysql-test dearsql-redis-test \
                   dearsql-mongodb-test dearsql-mssql-test dearsql-oracle-test \
                   dearsql-redshift-test dearsql-cassandra-test dearsql-ssh-test; do
            echo "===== $c ====="
            docker logs --tail=200 "$c" 2>&1 || true
          done
