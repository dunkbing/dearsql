name: Build Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# release-only vcpkg packages (cmake/triplets): keep_env_vars lets the triplet see it,
# the triplet hashes it into the abi (VCPKG_ENV_PASSTHROUGH)
env:
  DEARSQL_VCPKG_RELEASE_ONLY: "1"
  VCPKG_KEEP_ENV_VARS: DEARSQL_VCPKG_RELEASE_ONLY

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libepoxy-dev libx11-dev \
            libtirpc-dev libltdl-dev python3-venv \
            autoconf automake autoconf-archive \
            libkrb5-dev gperf

      # 22.04 for glibc 2.35 (#54); its gcc 11 lacks std::format
      - name: Install gcc 13
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Setup vcpkg
        id: vcpkg
        continue-on-error: true # a github download hiccup; retried below
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "db23990c5a6e2953bf1eb8c86e9a64c73d5b1fa7"

      - name: Wait before retrying vcpkg
        if: steps.vcpkg.outcome == 'failure'
        run: sleep 60
        shell: bash

      - name: Setup vcpkg (retry)
        if: steps.vcpkg.outcome == 'failure'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "db23990c5a6e2953bf1eb8c86e9a64c73d5b1fa7"

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: build_release/vcpkg_installed
          key: vcpkg-installed-linux-jammy-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}
          restore-keys: |
            vcpkg-installed-linux-jammy-${{ matrix.arch }}-

      - name: Inject secrets into APP_METADATA
        run: |
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> APP_METADATA
          echo "POLAR_ORGANIZATION_ID=${{ secrets.POLAR_ORGANIZATION_ID }}" >> APP_METADATA
          echo "CREDS_SECRET=${{ secrets.CREDS_SECRET }}" >> APP_METADATA

      - name: Build and package
        run: |
          export CMAKE_GENERATOR=Ninja
          ./scripts/build release

      - name: Set env vars
        run: |
          APP_NAME=$(grep '^APP_NAME=' APP_METADATA | cut -d= -f2)
          echo "APPIMAGE_NAME=${APP_NAME}-${{ matrix.arch }}.AppImage" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dearsql-linux-appimage-${{ matrix.arch }}
          path: |
            build_release/${{ env.APPIMAGE_NAME }}
            build_release/${{ env.APPIMAGE_NAME }}.sha256

  # one version.json listing every arch, then the release upload
  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download AppImages
        uses: actions/download-artifact@v4
        with:
          pattern: dearsql-linux-appimage-*
          path: dist
          merge-multiple: true

      - name: Create version metadata file
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          entry() {
            local file sha
            file=$(ls dist/*-"$1".AppImage)
            sha=$(cut -d' ' -f1 "${file}.sha256")
            printf '    "appimage-%s": {\n      "url": "https://github.com/%s/releases/download/v%s/%s",\n      "sha256": "%s"\n    }' \
              "$1" "$GITHUB_REPOSITORY" "$VERSION" "$(basename "$file")" "$sha"
          }

          {
            printf '{\n  "version": "%s",\n  "release_notes": "",\n  "downloads": {\n' "$VERSION"
            entry x86_64
            printf ',\n'
            entry aarch64
            printf '\n  }\n}\n'
          } > dist/version.json

          rm dist/*.sha256
          cat dist/version.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dearsql-linux-appimage
          path: dist/*

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
