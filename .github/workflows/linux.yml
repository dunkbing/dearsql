name: Build Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libepoxy-dev libx11-dev \
            libtirpc-dev libltdl-dev python3-venv \
            autoconf automake autoconf-archive \
            freetds-dev libgnutls28-dev libkrb5-dev

      # vcpkg ships no prebuilt cmake/ninja for arm64 linux
      - name: Use system cmake/ninja on arm64
        if: matrix.arch == 'aarch64'
        run: echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> "$GITHUB_ENV"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "db23990c5a6e2953bf1eb8c86e9a64c73d5b1fa7"

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: build_release/vcpkg_installed
          key: vcpkg-installed-linux-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}-0a434205
          restore-keys: |
            vcpkg-installed-linux-${{ matrix.arch }}-

      - name: Inject secrets into APP_METADATA
        run: |
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> APP_METADATA
          echo "POLAR_ORGANIZATION_ID=${{ secrets.POLAR_ORGANIZATION_ID }}" >> APP_METADATA
          echo "CREDS_SECRET=${{ secrets.CREDS_SECRET }}" >> APP_METADATA

      - name: Debug cache env
        run: |
          echo "ACTIONS_CACHE_URL is set: $([ -n "$ACTIONS_CACHE_URL" ] && echo yes || echo no)"
          echo "VCPKG_BINARY_SOURCES: $VCPKG_BINARY_SOURCES"

      - name: Build and package
        run: |
          export CMAKE_GENERATOR=Ninja
          ./scripts/build release

      - name: Set env vars
        run: |
          APP_NAME=$(grep '^APP_NAME=' APP_METADATA | cut -d= -f2)
          echo "APPIMAGE_NAME=${APP_NAME}-${{ matrix.arch }}.AppImage" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dearsql-linux-appimage-${{ matrix.arch }}
          path: |
            build_release/${{ env.APPIMAGE_NAME }}
            build_release/${{ env.APPIMAGE_NAME }}.sha256

  # one version.json listing every arch, then the release upload
  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download AppImages
        uses: actions/download-artifact@v4
        with:
          pattern: dearsql-linux-appimage-*
          path: dist
          merge-multiple: true

      - name: Create version metadata file
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          entry() {
            local file sha
            file=$(ls dist/*-"$1".AppImage)
            sha=$(cut -d' ' -f1 "${file}.sha256")
            printf '    "appimage-%s": {\n      "url": "https://github.com/%s/releases/download/v%s/%s",\n      "sha256": "%s"\n    }' \
              "$1" "$GITHUB_REPOSITORY" "$VERSION" "$(basename "$file")" "$sha"
          }

          {
            printf '{\n  "version": "%s",\n  "release_notes": "",\n  "downloads": {\n' "$VERSION"
            entry x86_64
            printf ',\n'
            entry aarch64
            printf '\n  }\n}\n'
          } > dist/version.json

          rm dist/*.sha256
          cat dist/version.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dearsql-linux-appimage
          path: dist/*

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
